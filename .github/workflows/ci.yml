name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  reference-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reference integrity (no bare cross-plugin references)
        run: ./scripts/check-reference-integrity.sh
